<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>✏ Chỉnh sửa Sách</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* Navbar */
    .navbar {
      background-color: #007bff;
    }
    .navbar-brand, .nav-link {
      color: white !important;
    }
    .nav-link:hover {
      text-decoration: underline;
    }
    .navbar-toggler {
      border: none;
    }
    .btn-custom {
      background-color: #E0E0E0;
      color: #000000;
      border: 2px solid #000000;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      transition: 0.3s;
    }
    .btn-custom:hover {
      background-color: #007bff;
      color: white;
    }

    body {
      padding-top: 70px;
    }
    .card {
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/books">📚 Quản Lý Sách</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="/books">📖 Danh Sách Sách</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/books/form">➕ Thêm Sách</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="text-center">✏ Chỉnh sửa Sách</h2>
  <form th:action="@{/books/update}" th:object="${book}" method="post" enctype="multipart/form-data" class="card p-4 shadow-lg needs-validation" novalidate>
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label class="form-label">📌 Tiêu đề sách:</label>
      <input type="text" class="form-control" th:field="*{title}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">✍ Tác giả:</label>
      <input type="text" class="form-control" th:field="*{author}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">📅 Ngày xuất bản:</label>
      <input type="date" class="form-control" th:field="*{publishedDate}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">📖 Mô tả sách:</label>
      <textarea class="form-control" th:field="*{description}" rows="3" required></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">🖼 Ảnh Bìa (Tối đa 20MB, có thể bỏ trống):</label>
      <input type="file" class="form-control" name="image" accept="image/jpeg, image/png" id="imageInput">
    </div>

    <div th:if="${book.imageUrl}" class="mb-3 text-center">
      <p>📷 Ảnh hiện tại:</p>
      <img th:src="${book.imageUrl}" class="img-thumbnail mt-2" style="max-width: 200px;" id="currentImage">
      <input type="hidden" th:field="*{imageUrl}">
    </div>

    <div class="mb-3 text-center" id="newImagePreview" style="display:none;">
      <p>📷 Ảnh mới:</p>
      <img id="newImage" class="img-thumbnail mt-2" style="max-width: 200px;">
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary">💾 Lưu</button>
      <a href="/books" class="btn btn-secondary">↩ Quay lại</a>
    </div>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const imageInput = document.getElementById('imageInput');
    const currentImage = document.getElementById('currentImage');
    const newImagePreview = document.getElementById('newImagePreview');
    const newImage = document.getElementById('newImage');

    imageInput.addEventListener('change', function () {
      const file = imageInput.files[0];

      if (file) {
        const reader = new FileReader();

        reader.onload = function (e) {
          newImage.src = e.target.result;
          newImagePreview.style.display = 'block';
        };

        reader.readAsDataURL(file);
      } else {
        newImagePreview.style.display = 'none';
      }
    });
  });
</script>

</body>
</html>
