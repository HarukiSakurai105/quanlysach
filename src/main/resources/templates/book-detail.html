<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết Sách</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    /* Header */
    .navbar {
      background-color: #007bff;
    }
    .navbar-brand, .nav-link {
      color: white !important;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    /* Card */
    .book-detail-card {
      border-radius: 12px;
      padding: 20px;
      background: white;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      margin: auto;
    }
    .book-img-container {
      text-align: center;
    }
    .book-img {
      width: 200px; /* Ảnh nhỏ nhưng rõ nét */
      height: auto;
      border-radius: 10px;
      box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
    }
    .book-title {
      font-size: 26px;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 10px;
    }
    .book-detail p {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .btn-custom {
      font-size: 17px;
      padding: 8px 16px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .btn-custom:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/books">📚 Quản Lý Sách</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link btn btn-light text-primary ms-3" href="/books">🏠 Trang chủ</a>
        </li>
        <li class="nav-item">
          <a class="nav-link btn btn-light text-primary ms-3" href="/books/form">➕ Thêm Sách Mới</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Nội dung -->
<div class="container mt-4">
  <div class="book-detail-card text-center">
    <!-- Ảnh sách -->
    <div class="book-img-container">
      <img th:src="@{${book.imageUrl}}" alt="Ảnh sách" class="book-img">
    </div>
    <!-- Thông tin sách -->
    <div class="mt-3 book-detail">
      <h2 class="book-title" th:text="${book.title}"></h2>
      <p><strong>✍ Tác giả:</strong> <span th:text="${book.author}"></span></p>
      <p><strong>📅 Ngày xuất bản:</strong> <span th:text="${book.publishedDate}"></span></p>
      <p><strong>📖 Mô tả:</strong></p>
      <p th:text="${book.description}"></p>

      <!-- Nút hành động -->
      <div class="mt-3">
        <a href="/books" class="btn btn-secondary btn-custom">⬅ Quay lại</a>
        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning btn-custom">✏ Chỉnh sửa</a>
        <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger btn-custom">🗑 Xóa</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
