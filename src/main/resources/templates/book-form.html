<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sách</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <script>
        function validateImage(input) {
            const file = input.files[0];
            if (file) {
                const validTypes = ['image/jpeg', 'image/png'];
                const maxSize = 20 * 1024 * 1024; // 20MB

                if (!validTypes.includes(file.type)) {
                    alert('⚠ Chỉ chấp nhận tệp JPG hoặc PNG!');
                    input.value = '';
                    return;
                }

                if (file.size > maxSize) {
                    alert('⚠ Kích thước ảnh không được vượt quá 20MB!');
                    input.value = '';
                    return;
                }

                // Hiển thị ảnh xem trước
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</head>
<body class="container mt-4">

<h2 class="text-center">📖 Quản Lý Sách</h2>

<form th:action="@{/books/save}" th:object="${book}" method="post" enctype="multipart/form-data" class="card p-4 shadow-lg">
    <!-- Hiển thị lỗi nếu có -->
    <div th:if="${#fields.hasErrors()}" class="alert alert-danger">
        <ul>
            <li th:each="error : ${#fields.errors('book')}" th:text="${error}"></li>
        </ul>
    </div>

    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label for="title" class="form-label">📌 Tiêu đề sách:</label>
        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Nhập tiêu đề sách" required>
    </div>

    <div class="mb-3">
        <label for="author" class="form-label">✍ Tác giả:</label>
        <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="Nhập tên tác giả" required>
    </div>

    <div class="mb-3">
        <label for="publishedDate" class="form-label">📅 Ngày xuất bản:</label>
        <input type="date" id="publishedDate" th:field="*{publishedDate}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label for="description" class="form-label">📖 Mô tả sách:</label>
        <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Nhập mô tả sách"></textarea>
    </div>

    <div class="mb-3">
        <label for="image" class="form-label">🖼 Chọn ảnh (Tối đa 20MB, có thể bỏ trống):</label>
        <input type="file" id="image" name="image" class="form-control"
               accept="image/jpeg, image/png" onchange="validateImage(this)">
    </div>

    <!-- Ảnh xem trước -->
    <div id="previewContainer" class="mb-3 text-center" style="display: none;">
        <p>🖼 Ảnh xem trước:</p>
        <img id="previewImage" class="img-thumbnail mt-2" style="max-width: 200px;">
    </div>

    <!-- Hiển thị ảnh cũ nếu có -->
    <div th:if="${book.imageUrl}" class="mb-3 text-center">
        <p>📷 Ảnh hiện tại:</p>
        <img th:src="${book.imageUrl}" class="img-thumbnail mt-2" style="max-width: 200px;">
        <input type="hidden" th:field="*{imageUrl}"> <!-- Giữ ảnh cũ nếu không tải ảnh mới -->
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-primary">💾 Lưu sách</button>
        <a href="/books" class="btn btn-secondary">↩ Quay lại danh sách</a>
    </div>
</form>

</body>
</html>
