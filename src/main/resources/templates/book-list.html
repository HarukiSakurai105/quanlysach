<!DOCTYPE html>
<html xmlns:th="http://thymbleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📚 Quản Lý Sách</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Header */
        .navbar {
            background-color: #007bff;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .navbar-toggler {
            border: none;
        }

        /* Giao diện thanh tìm kiếm */
        .search-container {
            max-width: 400px;
            position: relative;
        }
        .search-input {
            border-radius: 25px;
            padding: 10px 15px;
            border: 2px solid #007bff;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        .search-input:focus {
            box-shadow: 0px 0px 10px rgba(0, 123, 255, 0.5);
        }

        /* Gợi ý tìm kiếm */
        #searchSuggestions {
            max-height: 200px;
            overflow-y: auto;
            border-radius: 10px;
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: absolute;
            width: 100%;
            z-index: 10;
            background: white;
            border: 1px solid #ddd;
        }
        #searchSuggestions.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Book Card */
        .book-card {
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
            min-height: 350px;
        }
        .book-card:hover {
            transform: scale(1.05);
        }
        .book-img {
            width: 100%;
            height: 250px;
            object-fit: contain;  /* Changed to 'contain' to maintain aspect ratio */
            border-radius: 5px;
            background-color: #f8f9fa;
        }

        /* Modal */
        .modal-body img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;  /* Maintain aspect ratio */
            border-radius: 5px;
        }

        /* Container for filters and search */
        .filters-container {
            margin-bottom: 20px;
        }

        .filters-container .form-select {
            margin-top: 10px;
        }

        /* Smooth transition for dropdown */
        .dropdown-menu {
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .dropdown-menu.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let searchInput = document.getElementById("searchInput");
            let searchSuggestions = document.getElementById("searchSuggestions");

            // Xử lý khi nhập vào ô tìm kiếm
            searchInput.addEventListener("keyup", function (event) {
                let input = searchInput.value.toLowerCase();
                let books = document.getElementsByClassName("book-card");
                searchSuggestions.innerHTML = "";

                if (input === "") {
                    searchSuggestions.classList.remove("show");
                    return;
                }

                let suggestions = [];
                for (let book of books) {
                    let title = book.querySelector("h5").innerText.toLowerCase();
                    if (title.includes(input)) {
                        let suggestionItem = document.createElement("li");
                        suggestionItem.classList.add("list-group-item", "list-group-item-action");
                        suggestionItem.innerText = book.querySelector("h5").innerText;
                        suggestionItem.onclick = function () {
                            searchInput.value = suggestionItem.innerText;
                            searchSuggestions.classList.remove("show");
                            searchBooks();
                        };
                        suggestions.push(suggestionItem);
                    }
                }

                if (suggestions.length > 0) {
                    suggestions.forEach(item => searchSuggestions.appendChild(item));
                    searchSuggestions.classList.add("show");
                } else {
                    searchSuggestions.classList.remove("show");
                }

                // Nhấn Enter để tìm kiếm
                if (event.key === "Enter") {
                    searchBooks();
                    searchSuggestions.classList.remove("show");
                }
            });

            document.addEventListener("click", function (e) {
                if (!searchInput.contains(e.target) && !searchSuggestions.contains(e.target)) {
                    searchSuggestions.classList.remove("show");
                }
            });

            // Xử lý lọc tác giả
            let authorFilter = document.getElementById("authorFilter");
            authorFilter.addEventListener("change", function () {
                searchBooks();
            });

            // Xử lý sắp xếp sách
            let sortFilter = document.getElementById("sortFilter");
            sortFilter.addEventListener("change", function () {
                sortBooks();
            });
        });

        // Tìm kiếm sách
        function searchBooks() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let author = document.getElementById("authorFilter").value;
            let books = document.getElementsByClassName("book-card");

            for (let book of books) {
                let title = book.querySelector("h5").innerText.toLowerCase();
                let bookAuthor = book.querySelector(".book-author").innerText.toLowerCase();
                let isVisible = title.includes(input) && (author === "all" || bookAuthor.includes(author));
                book.parentElement.style.display = isVisible ? "block" : "none";
            }
        }

        // Sắp xếp sách theo tiêu đề
        function sortBooks() {
            let booksContainer = document.getElementById("bookList");
            let books = Array.from(booksContainer.getElementsByClassName("col-md-4"));
            let sortValue = document.getElementById("sortFilter").value;

            books.sort((a, b) => {
                let titleA = a.querySelector("h5").innerText.toLowerCase();
                let titleB = b.querySelector("h5").innerText.toLowerCase();

                if (sortValue === "asc") {
                    return titleA.localeCompare(titleB);
                } else {
                    return titleB.localeCompare(titleA);
                }
            });

            books.forEach(book => booksContainer.appendChild(book));
        }
    </script>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="books">📚 Quản Lý Sách</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link btn btn-light text-primary ms-3" href="/books/form">➕ Thêm Sách Mới</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Thanh tìm kiếm và lọc -->
    <div class="filters-container d-flex justify-content-between">
        <div class="search-container">
            <input type="text" id="searchInput" class="form-control search-input" placeholder="🔍 Tìm kiếm sách...">
            <ul id="searchSuggestions" class="list-group"></ul>
        </div>

        <div class="dropdown">
            <button class="btn btn-primary dropdown-toggle" type="button" id="filtersDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Bộ lọc
            </button>
            <ul class="dropdown-menu" aria-labelledby="filtersDropdown">
                <!-- Lọc tác giả -->
                <li>
                    <select id="authorFilter" class="form-select">
                        <option value="all">Tất cả tác giả</option>
                        <!-- Lặp qua danh sách tác giả -->
                        <option th:each="author : ${authors}" th:value="${author}" th:text="${author}"></option>
                    </select>
                </li>
                <!-- Lọc sắp xếp -->
                <li>
                    <select id="sortFilter" class="form-select">
                        <option value="asc">A - Z</option>
                        <option value="desc">Z - A</option>
                    </select>
                </li>
            </ul>
        </div>
    </div>

    <!-- DANH SÁCH SÁCH -->
    <div id="bookList" class="row">
        <div class="col-md-4 mb-4" th:each="book : ${books}">
            <div class="book-card text-center p-3" data-bs-toggle="modal" th:attr="data-bs-target='#bookModal'+${book.id}">
                <img th:src="${book.imageUrl != null && book.imageUrl != '' ? book.imageUrl : '/images/default-book.png'}"
                     alt="Ảnh sách" class="book-img">
                <h5 class="mt-2" th:text="${book.title}"></h5>
                <p class="text-muted book-author" th:text="${book.author}"></p>
            </div>

            <!-- MODAL HIỂN THỊ CHI TIẾT SÁCH -->
            <div class="modal fade" th:id="'bookModal'+${book.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" th:text="${book.title}"></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body text-center">
                            <img th:src="${book.imageUrl}" alt="Ảnh sách" class="img-thumbnail">
                            <p><strong>Tác giả:</strong> <span th:text="${book.author}"></span></p>
                        </div>
                        <div class="modal-footer">
                            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning">✏ Sửa</a>
                            <a th:href="@{/books/confirm-delete/{id}(id=${book.id})}" class="btn btn-danger">🗑 Xóa</a>
                            <a th:href="@{/books/detail/{id}(id=${book.id})}" class="btn btn-info">📚Đọc thêm</a>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
