<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sách</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .book-card {
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: scale(1.05);
        }
        .book-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .modal-body img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
        }
    </style>
</head>
<body class="container mt-4">

<!-- HEADER -->
<h2 class="text-center">📚 Danh Sách Sách</h2>
<div class="text-end mb-3">
    <a href="/books/form" class="btn btn-success">➕ Thêm Sách Mới</a>
</div>

<!-- DANH SÁCH SÁCH HIỂN THỊ DẠNG THẺ -->
<div class="row">
    <div class="col-md-4 mb-4" th:each="book : ${books}">
        <div class="book-card text-center p-3" data-bs-toggle="modal" th:attr="data-bs-target='#bookModal'+${book.id}">
            <!-- Hiển thị ảnh, nếu không có thì dùng ảnh mặc định -->
            <img th:src="${book.imageUrl != null && book.imageUrl != '' ? book.imageUrl : '/images/default-book.png'}"
                 alt="Ảnh sách" class="book-img">
            <h5 class="mt-2" th:text="${book.title}"></h5>
            <p class="text-muted" th:text="${book.author}"></p>
        </div>

        <!-- MODAL HIỂN THỊ CHI TIẾT SÁCH -->
        <div class="modal fade" th:id="'bookModal'+${book.id}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="${book.title}"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <img th:src="${book.imageUrl != null && book.imageUrl != '' ? book.imageUrl : '/images/default-book.png'}"
                             alt="Ảnh sách">
                        <p class="mt-3"><strong>Tác giả:</strong> <span th:text="${book.author}"></span></p>
                        <p class="mt-3" th:if="${book.description != null && book.description != ''}">
                            <strong>Mô tả:</strong> <span th:text="${book.description}"></span>
                        </p>
                    </div>
                    <div class="modal-footer">
                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning">✏ Sửa</a>
                        <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa?')">🗑 Xóa</a>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
