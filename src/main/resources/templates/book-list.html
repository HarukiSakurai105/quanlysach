<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>📚 Quản Lý Sách</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* Header */
        .navbar {
            background-color: #007bff;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .nav-link:hover {
            text-decoration: underline;
        }

        /* Book Card */
        .book-card {
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: scale(1.05);
        }
        .book-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .modal-body img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
        }
    </style>

    <script>
        // Tìm kiếm sách theo tiêu đề
        function searchBooks() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let books = document.getElementsByClassName("book-card");

            for (let book of books) {
                let title = book.querySelector("h5").innerText.toLowerCase();
                book.parentElement.style.display = title.includes(input) ? "block" : "none";
            }
        }

        // Sắp xếp sách theo A-Z hoặc Z-A
        function sortBooks(order) {
            let container = document.getElementById("bookList");
            let books = Array.from(container.getElementsByClassName("col-md-4"));

            books.sort((a, b) => {
                let titleA = a.querySelector("h5").innerText.toLowerCase();
                let titleB = b.querySelector("h5").innerText.toLowerCase();
                return order === "asc" ? titleA.localeCompare(titleB) : titleB.localeCompare(titleA);
            });

            books.forEach(book => container.appendChild(book));
        }

        // Lọc sách theo tác giả
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".filter-author").forEach(item => {
                item.addEventListener("click", function () {
                    let author = this.getAttribute("data-author").toLowerCase();
                    let books = document.getElementsByClassName("book-card");

                    for (let book of books) {
                        let bookAuthor = book.querySelector("p").innerText.toLowerCase();
                        book.parentElement.style.display = (author === "all" || bookAuthor === author) ? "block" : "none";
                    }
                });
            });
        });
    </script>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">📚 Quản Lý Sách</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/books">📖 Danh Sách Sách</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light text-primary ms-3" href="/books/form">➕ Thêm Sách Mới</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- THANH TÌM KIẾM VÀ BỘ LỌC -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Ô tìm kiếm -->
        <div class="input-group" style="max-width: 400px;">
            <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm kiếm sách..." onkeyup="searchBooks()">
            <button class="btn btn-outline-primary" onclick="searchBooks()">Tìm</button>
        </div>

        <!-- Nút Lọc -->
        <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                🔍 Lọc & Sắp xếp
            </button>
            <ul class="dropdown-menu">
                <li class="dropdown-header">📖 Lọc theo tác giả</li>
                <li><a class="dropdown-item filter-author" href="#" data-author="all">Tất cả</a></li>
                <li th:each="book : ${books}">
                    <a class="dropdown-item filter-author" href="#" th:text="${book.author}" th:attr="data-author=${book.author}"></a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li class="dropdown-header">🔀 Sắp xếp</li>
                <li><a class="dropdown-item" href="#" onclick="sortBooks('asc')">🔼 A → Z</a></li>
                <li><a class="dropdown-item" href="#" onclick="sortBooks('desc')">🔽 Z → A</a></li>
            </ul>
        </div>
    </div>

    <!-- DANH SÁCH SÁCH HIỂN THỊ DẠNG THẺ -->
    <div id="bookList" class="row">
        <div class="col-md-4 mb-4" th:each="book : ${books}">
            <div class="book-card text-center p-3" data-bs-toggle="modal" th:attr="data-bs-target='#bookModal'+${book.id}">
                <!-- Hiển thị ảnh, nếu không có thì dùng ảnh mặc định -->
                <img th:src="${book.imageUrl != null && book.imageUrl != '' ? book.imageUrl : '/images/default-book.png'}"
                     alt="Ảnh sách" class="book-img">
                <h5 class="mt-2" th:text="${book.title}"></h5>
                <p class="text-muted" th:text="${book.author}"></p>
            </div>

            <!-- MODAL HIỂN THỊ CHI TIẾT SÁCH -->
            <div class="modal fade" th:id="'bookModal'+${book.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" th:text="${book.title}"></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body text-center">
                            <img th:src="${book.imageUrl != null && book.imageUrl != '' ? book.imageUrl : '/images/default-book.png'}"
                                 alt="Ảnh sách">
                            <p class="mt-3"><strong>Tác giả:</strong> <span th:text="${book.author}"></span></p>
                            <p class="mt-3" th:if="${book.description != null && book.description != ''}">
                                <strong>Mô tả:</strong> <span th:text="${book.description}"></span>
                            </p>
                        </div>
                        <div class="modal-footer">
                            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning">✏ Sửa</a>
                            <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-danger"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa?')">🗑 Xóa</a>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>
</body>
</html>
